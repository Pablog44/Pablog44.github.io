<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14151b">
  <title>Catedral 3D</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14151b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}
    #hud{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;gap:10px;align-items:start;font-size:14px;text-shadow:0 2px 5px #000}#status{background:#13141dcc;padding:8px 12px;border:1px solid #ffffff38;border-radius:12px}#recenter{pointer-events:auto;border:1px solid #ffffff55;background:#171923cc;color:white;border-radius:12px;padding:8px 12px;font:inherit;display:none}#reticle{position:absolute;top:50%;left:50%;width:20px;height:20px;transform:translate(-50%,-50%)}#reticle:before,#reticle:after{content:"";position:absolute;background:#fff9;box-shadow:0 0 3px #000}#reticle:before{width:2px;height:20px;left:9px}#reticle:after{width:20px;height:2px;top:9px}
    #joystick{pointer-events:auto;position:absolute;left:clamp(20px,8vw,80px);bottom:max(22px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;border:2px solid #ffffff73;background:#14182177;display:none;touch-action:none}#stick{position:absolute;left:42px;top:42px;width:44px;height:44px;border-radius:50%;background:#f5e8d2ac;border:2px solid white;box-shadow:0 2px 15px #0008}
    #fire{pointer-events:auto;position:absolute;right:clamp(22px,7vw,80px);bottom:max(44px,env(safe-area-inset-bottom));width:84px;height:84px;border:2px solid #ffdbb9;background:#9a3329b8;color:white;border-radius:50%;font-size:15px;font-weight:750;display:none;touch-action:none}#fire:active{background:#dc5548}
    #intro{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#11141bbd,#09090cdd);padding:20px;text-align:center}#card{width:min(100%,390px);padding:25px;border:1px solid #e8d8b36b;border-radius:18px;background:#17191ff2;box-shadow:0 14px 50px #000a}h1{font-family:Georgia,serif;font-size:32px;margin:0 0 10px;color:#efdfbd}p{line-height:1.45;color:#d6d5d1;margin:0 0 16px}#start{width:100%;border:0;border-radius:12px;background:#e1bc77;color:#211a12;font-weight:750;font-size:17px;padding:14px}#hint{font-size:13px;margin:12px 0 0;color:#c4c3c0}#notice{position:absolute;top:23%;left:50%;transform:translateX(-50%);background:#10131bdc;border-radius:12px;padding:10px 14px;white-space:nowrap;opacity:0;transition:opacity .2s;font-size:14px}#notice.show{opacity:1}@media(pointer:coarse){#joystick,#fire{display:block}}@media(max-height:430px){#joystick{width:100px;height:100px}#stick{left:28px;top:28px}#fire{width:70px;height:70px}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script>
</head>
<body>
  <div id="hud"><div id="top"><div id="status">Guardianes: <b id="score">0/3</b></div><button id="recenter">Centrar vista</button></div><div id="reticle"></div><div id="joystick"><div id="stick"></div></div><button id="fire">DISPARAR</button><div id="notice"></div></div>
  <div id="intro"><div id="card"><h1>Catedral 3D</h1><p>Mira alrededor moviendo el móvil. Usa el círculo izquierdo para caminar y dispara a los tres guardianes.</p><button id="start">Entrar en la catedral</button><p id="hint">El móvil pedirá permiso para usar sus sensores. En ordenador: arrastra el ratón, WASD y clic.</p></div></div>
  <script type="module">
    import * as THREE from 'three';
    const $=id=>document.getElementById(id), mobile=matchMedia('(pointer:coarse)').matches;
    const scene=new THREE.Scene();scene.background=new THREE.Color(0x11131b);
    const camera=new THREE.PerspectiveCamera(73,innerWidth/innerHeight,.08,90);camera.position.set(0,1.7,17);
    const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xbcd2eb,0x4d382d,2.15));const sun=new THREE.DirectionalLight(0xffe7c1,1.4);sun.position.set(1,14,-9);scene.add(sun);
    const mat=(c,other={})=>new THREE.MeshLambertMaterial({color:c,...other});
    let brick=mat(0x835b48),stone=mat(0x97938b),tile=mat(0x87929c),roof=mat(0x55545a);
    const trim=mat(0xc6b595),dark=mat(0x292e39),gold=mat(0xb89145,{emissive:0x4e2c0c}),red=mat(0x9d3036,{emissive:0x310808});
    function box(w,h,d,x,y,z,m){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);scene.add(mesh);return mesh}
    function cyl(rt,rb,h,x,y,z,m,n=10){const mesh=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),m);mesh.position.set(x,y,z);scene.add(mesh);return mesh}
    function beam(a,b,r,m){const v1=new THREE.Vector3(...a),v2=new THREE.Vector3(...b),diff=v2.clone().sub(v1);const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,diff.length(),8),m);mesh.position.copy(v1.add(v2).multiplyScalar(.5));mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),diff.normalize());scene.add(mesh)}
    function windowAt(x,z){const back=mat(0x10192c,{emissive:0x182b47});box(.13,4.8,1.7,x,6.05,z,back);const colors=[0x416dab,0x953d4d,0xc99b43,0x4f8e99];for(let i=0;i<4;i++){const pane=mat(colors[i],{emissive:colors[i],emissiveIntensity:.4});box(.16,3.7,.29,x+(x<0?.09:-.09),5.8,z-.6+i*.4,pane)}box(.2,5.1,.12,x,6,z-.87,trim);box(.2,5.1,.12,x,6,z+.87,trim);box(.2,.12,1.9,x,3.5,z,trim);beam([x,8.5,z-.92],[x,9.25,z],.12,trim);beam([x,9.25,z],[x,8.5,z+.92],.12,trim)}
    function build(){box(24,.35,48,0,-.2,0,tile);box(24,.45,48,0,13.25,0,roof);box(.55,13,48,-12,6.5,0,brick);box(.55,13,48,12,6.5,0,brick);box(24,13,.55,0,6.5,-24,stone);box(24,13,.55,0,6.5,24,stone);
      for(let s of [-1,1]){for(let z of [-17,-9,-1,7,15]){const x=s*7;cyl(.65,.76,9.5,x,4.75,z,stone,12);cyl(.92,.92,.34,x,9.55,z,trim,12);cyl(.86,.94,.35,x,.18,z,trim,12);windowAt(s*11.7,z-3.7)}for(let z of [-17,-9,-1,7]){const a=z,b=z+8;beam([s*7,9.7,a],[s*7,11.6,(a+b)/2],.22,trim);beam([s*7,11.6,(a+b)/2],[s*7,9.7,b],.22,trim)}for(let z of [-19,-11,-3,5,13]){box(4,.18,.28,s*9.5,9.95,z,trim)} }
      for(let z of [-19,-11,-3,5,13]){beam([-7,10.5,z],[0,12.85,z],.16,trim);beam([0,12.85,z],[7,10.5,z],.16,trim)}
      for(let z of [-20,-12,-4,4,12,20]){box(24,.28,.16,0,.13,z,trim)}
      box(8,.65,3,0,.35,-20,stone);box(5.4,1.1,2.4,0,1.15,-20.8,trim);box(4.8,.15,2.1,0,1.8,-20.8,gold);box(3.2,5,.3,0,6,-23.6,dark);beam([-2.1,7,-23.3],[0,9,-23.3],.26,gold);beam([0,9,-23.3],[2.1,7,-23.3],.26,gold);box(.3,3.4,.2,0,6.5,-23.2,gold);box(1.5,.3,.2,0,6.9,-23.2,gold);
      for(let x of [-3.6,3.6])for(let z of [-19,-22]){cyl(.12,.16,.8,x,2.25,z,gold);const flame=mat(0xffb35d,{emissive:0xff7d22,emissiveIntensity:1.5});cyl(.05,.1,.3,x,2.78,z,flame,7)}
    }build();
    const targets=[];function guardian(x,z){const group=new THREE.Group();group.position.set(x,0,z);scene.add(group);const cloak=new THREE.Mesh(new THREE.CylinderGeometry(.35,.6,1.65,8),dark);cloak.position.y=.95;group.add(cloak);const head=new THREE.Mesh(new THREE.SphereGeometry(.32,10,7),red);head.position.y=2.03;group.add(head);for(const s of [-1,1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.07,6,5),mat(0xffad3d,{emissive:0xff5a0d,emissiveIntensity:1}));eye.position.set(s*.12,2.08,.26);group.add(eye)}group.userData.alive=true;group.traverse(o=>{if(o.isMesh)o.userData.guardian=group});targets.push(group)}guardian(-4,-9);guardian(4,-1);guardian(0,-18);
    const loader=new THREE.TextureLoader();loader.load('./textures.png',img=>{const im=img.image,w=im.width,h=im.height;const create=(cx,cy,rx,ry)=>{const c=document.createElement('canvas');c.width=512;c.height=512;const ctx=c.getContext('2d');ctx.drawImage(im,cx*w/2,cy*h/2,w/2,h/2,0,0,512,512);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.colorSpace=THREE.SRGBColorSpace;return new THREE.MeshLambertMaterial({map:t,color:0xffffff})};brick=create(0,0,5,2);stone=create(1,0,1,2);tile=create(0,1,6,12);roof=create(1,1,6,12);scene.traverse(o=>{if(!o.isMesh)return;const pos=o.position;if(o.material.color?.getHex()===0x835b48)o.material=brick;else if(o.material.color?.getHex()===0x97938b)o.material=stone;else if(o.material.color?.getHex()===0x87929c)o.material=tile;else if(o.material.color?.getHex()===0x55545a)o.material=roof})});
    let active=false,sensor=false,hasOrientation=false,neutral=null,mouseYaw=0,mousePitch=0,score=0,last=performance.now();const joystick={x:0,y:0,id:null},keys=new Set();const qDevice=new THREE.Quaternion(),q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)),q0=new THREE.Quaternion(),euler=new THREE.Euler(),qOffset=new THREE.Quaternion(),forward=new THREE.Vector3(),ray=new THREE.Raycaster();
    function orientationQ(e){const alpha=THREE.MathUtils.degToRad(e.alpha||0),beta=THREE.MathUtils.degToRad(e.beta||0),gamma=THREE.MathUtils.degToRad(e.gamma||0),angle=THREE.MathUtils.degToRad(screen.orientation?.angle||window.orientation||0);euler.set(beta,alpha,-gamma,'YXZ');qDevice.setFromEuler(euler).multiply(q1).multiply(q0.setFromAxisAngle(new THREE.Vector3(0,0,1),-angle));return qDevice}
    function calibrate(){if(!hasOrientation)return;const f=new THREE.Vector3(0,0,-1).applyQuaternion(qDevice);const yaw=Math.atan2(-f.x,-f.z);qOffset.setFromAxisAngle(new THREE.Vector3(0,1,0),-yaw);neutral=true;notice('Vista centrada')}
    function notice(t){const n=$('notice');n.textContent=t;n.classList.add('show');clearTimeout(notice.timer);notice.timer=setTimeout(()=>n.classList.remove('show'),2200)}
    window.addEventListener('deviceorientation',e=>{if(!sensor||e.alpha===null)return;orientationQ(e);hasOrientation=true;if(!neutral)calibrate()},{passive:true});
    $('start').onclick=async()=>{active=true;$('intro').style.display='none';if(mobile){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();sensor=p==='granted'}else sensor='DeviceOrientationEvent'in window}catch{}if(sensor){$('recenter').style.display='block';notice('Mueve el móvil para mirar alrededor')}else notice('Arrastra a la derecha para mirar')}else notice('WASD para moverte · ratón para mirar · clic para disparar')};
    $('recenter').onclick=calibrate;
    const joy=$('joystick'),stick=$('stick');function moveStick(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,lim=r.width*.37,scale=Math.min(1,lim/Math.hypot(dx,dy));joystick.x=dx*scale/lim;joystick.y=dy*scale/lim;stick.style.transform=`translate(${dx*scale}px,${dy*scale}px)`}joy.onpointerdown=e=>{joystick.id=e.pointerId;joy.setPointerCapture(e.pointerId);moveStick(e)};joy.onpointermove=e=>{if(e.pointerId===joystick.id)moveStick(e)};function stopStick(e){if(e.pointerId!==joystick.id)return;joystick.id=null;joystick.x=joystick.y=0;stick.style.transform=''}joy.onpointerup=stopStick;joy.onpointercancel=stopStick;
    let drag=null;renderer.domElement.addEventListener('pointerdown',e=>{if(!active)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id||sensor&&hasOrientation)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>2)drag.moved=true;mouseYaw-=(e.clientX-drag.x)*.004;mousePitch=THREE.MathUtils.clamp(mousePitch-(e.clientY-drag.y)*.004,-1.2,1.2);drag.x=e.clientX;drag.y=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(drag?.id===e.pointerId){if(!drag.moved&&!mobile)shoot();drag=null}});
    addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='Space')shoot()});addEventListener('keyup',e=>keys.delete(e.code));$('fire').onpointerdown=e=>{e.preventDefault();shoot()};
    function shoot(){if(!active)return;ray.setFromCamera(new THREE.Vector2(0,0),camera);const meshes=[];targets.forEach(g=>{if(g.userData.alive)g.traverse(o=>{if(o.isMesh)meshes.push(o)})});const hit=ray.intersectObjects(meshes,false)[0];$('reticle').style.filter='drop-shadow(0 0 10px #ffb567)';setTimeout(()=>$('reticle').style.filter='',110);if(hit){const g=hit.object.userData.guardian;if(g?.userData.alive){g.userData.alive=false;scene.remove(g);score++;$('score').textContent=score+'/3';notice(score===3?'¡Catedral liberada!':'Guardián derrotado')}}}
    function collide(nx,nz){const r=.43;nx=THREE.MathUtils.clamp(nx,-11.25,11.25);nz=THREE.MathUtils.clamp(nz,-23.2,23.2);for(const s of [-1,1])for(const z of [-17,-9,-1,7,15]){const px=s*7,d=Math.hypot(nx-px,nz-z),min=.79+r;if(d<min){const ax=(nx-px)/(d||1),az=(nz-z)/(d||1);nx=px+ax*min;nz=z+az*min}}if(nz<-18.2&&Math.abs(nx)<4.5)nz=-18.2;return[nx,nz]}
    function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;if(active){if(sensor&&hasOrientation)camera.quaternion.copy(qOffset).multiply(qDevice);else camera.quaternion.setFromEuler(new THREE.Euler(mousePitch,mouseYaw,0,'YXZ'));forward.set(0,0,-1).applyQuaternion(camera.quaternion);forward.y=0;forward.normalize();const right=new THREE.Vector3(-forward.z,0,forward.x);let vx=joystick.x,vy=-joystick.y;if(keys.has('KeyW')||keys.has('ArrowUp'))vy+=1;if(keys.has('KeyS')||keys.has('ArrowDown'))vy-=1;if(keys.has('KeyA')||keys.has('ArrowLeft'))vx-=1;if(keys.has('KeyD')||keys.has('ArrowRight'))vx+=1;const len=Math.hypot(vx,vy);if(len>1){vx/=len;vy/=len}const speed=4.3*dt,[nx,nz]=collide(camera.position.x+(right.x*vx+forward.x*vy)*speed,camera.position.z+(right.z*vx+forward.z*vy)*speed);camera.position.x=nx;camera.position.z=nz}renderer.render(scene,camera)}requestAnimationFrame(frame);
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  </script>
</body>
